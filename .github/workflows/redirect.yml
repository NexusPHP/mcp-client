name: Redirect to the monorepo

on:
  issues:
    types:
      - opened
  pull_request_target:
    types:
      - opened

permissions:
  issues: write
  pull-requests: write

jobs:
  redirect:
    name: Close and point to NexusPHP/mcp
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Close with a pointer to the monorepo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          KIND: ${{ github.event_name == 'issues' && 'issue' || 'pr' }}
        run: |
          message="Thank you. This repository is a read-only subtree split of https://github.com/NexusPHP/mcp and is not monitored. Please open it again at https://github.com/NexusPHP/mcp/issues (issues) or https://github.com/NexusPHP/mcp/pulls (pull requests), where it will be seen."

          if [ "$KIND" = 'issue' ]; then
            gh issue close "$NUMBER" --repo "$REPOSITORY" --reason 'not planned' --comment "$message"
          else
            gh pr close "$NUMBER" --repo "$REPOSITORY" --comment "$message"
          fi

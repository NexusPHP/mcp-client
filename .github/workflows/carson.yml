name: Carson

on:
  issues:
    types:
      - opened
  pull_request_target:
    types:
      - opened

permissions: {}

jobs:
  carson:
    name: Close and point to NexusPHP/mcp
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Run Carson
        uses: NexusPHP/carson@80ba8380498b061f22de749c7609f265c8d66120 # v1.3.0
        with:
          app_id: ${{ secrets.CARSON_APP_ID }}
          private_key: ${{ secrets.CARSON_PRIVATE_KEY }}
          log_level: info

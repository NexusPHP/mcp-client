name: Carson

on:
  issues:
    types:
      - opened
      - reopened
  pull_request_target:
    types:
      - opened
      - reopened

permissions: {}

jobs:
  carson:
    name: Close and point to NexusPHP/mcp
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Run Carson
        uses: NexusPHP/carson@cb35604ab330c2e44dba673fcef712c78e75f858 # v1.7.0
        with:
          app_id: ${{ secrets.CARSON_APP_ID }}
          private_key: ${{ secrets.CARSON_PRIVATE_KEY }}
          log_level: info

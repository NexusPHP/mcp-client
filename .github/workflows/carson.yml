name: Carson

on:
  issues:
    types:
      - opened
      - reopened
  pull_request_target:
    types:
      - opened
      - reopened

permissions: {}

jobs:
  carson:
    name: Close and point to NexusPHP/mcp
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Run Carson
        uses: NexusPHP/carson@26920bbff1ed032719e8f2aba38cc6d9d0472470 # v1.9.0
        with:
          app_id: ${{ secrets.CARSON_APP_ID }}
          private_key: ${{ secrets.CARSON_PRIVATE_KEY }}
          log_level: info

name: Carson

on:
  issues:
    types:
      - opened
      - reopened
  pull_request_target:
    types:
      - opened
      - reopened

permissions: {}

jobs:
  carson:
    name: Close and point to NexusPHP/mcp
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Run Carson
        uses: NexusPHP/carson@53c45cf25e2303bc503209f8b5dd9107f27b2e8f # v1.8.0
        with:
          app_id: ${{ secrets.CARSON_APP_ID }}
          private_key: ${{ secrets.CARSON_PRIVATE_KEY }}
          log_level: info

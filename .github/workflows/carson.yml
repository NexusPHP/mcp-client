name: Carson

on:
  issues:
    types:
      - opened
      - reopened
  pull_request_target:
    types:
      - opened
      - reopened

permissions: {}

jobs:
  carson:
    name: Close and point to NexusPHP/mcp
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Run Carson
        uses: NexusPHP/carson@44db1c01ff55b596cabec251fec6307dabd0852e # v1.4.3
        with:
          app_id: ${{ secrets.CARSON_APP_ID }}
          private_key: ${{ secrets.CARSON_PRIVATE_KEY }}
          log_level: info
